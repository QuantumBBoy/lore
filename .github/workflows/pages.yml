name: Deploy to GitHub Pages

# Serves skills/ at https://<owner>.github.io/<repo>/skills/<name>.
# That URL is also the storage origin for Kin's data: keep it stable (see PRIVACY.md).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Validate skills
        run: node tools/validate-skills.mjs skills

      - name: Build the site
        run: node tools/build-site.mjs

      - name: Validate the built site (.nojekyll, SKILL.md rules)
        run: node tools/validate-skills.mjs --site _site

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
