name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate skills (strict SKILL.md rules)
        run: npm run validate

      - name: Check the generated Kin pages are up to date
        run: node tools/build-kin.mjs --check

      - name: Build the Pages site
        run: npm run build

      - name: Validate the built site
        run: node tools/validate-skills.mjs --site _site

      - name: Replay Kin's logged mistakes (evals/cases.jsonl)
        run: npm run evals

      - name: Install Chromium and WebKit (the iPhone's engine) for browser tests
        run: npx playwright install --with-deps chromium webkit

      - name: Unit, privacy and browser tests
        run: npm test
        env:
          LORE_REQUIRE_BROWSERS: '1'
