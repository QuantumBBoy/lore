name: Release

# When main has a version (package.json) that has no GitHub release yet, run CI and publish the
# release vX.Y.Z at that commit, with the notes of its section in CHANGELOG.md ("## Kin X.Y.Z, …").
# GitHub creates the tag. tests/release.test.mjs keeps the versions and the changelog in step, so a
# release cannot go out without notes.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      exists: ${{ steps.version.outputs.exists }}
    steps:
      - uses: actions/checkout@v7

      - name: Is this version released?
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" > /dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi

  ci:
    needs: check
    if: needs.check.outputs.exists == 'false'
    uses: ./.github/workflows/ci.yml

  release:
    needs: [check, ci]
    if: needs.check.outputs.exists == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            /^## / { if (found) exit; if (index($0, "## Kin " v ",") == 1) { found = 1; print substr($0, 4) > "title.txt"; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "CHANGELOG.md has no section for Kin $VERSION"; exit 1; fi
          # Links to files in the repository point at this version on GitHub.
          sed -i -E "s#\]\(([^):#][^):]*)\)#](https://github.com/${GITHUB_REPOSITORY}/blob/v${VERSION}/\1)#g" notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: gh release create "v$VERSION" --target "$GITHUB_SHA" --title "$(cat title.txt)" --notes-file notes.md
