name: Release

# Pushing a tag vX.Y.Z runs CI, then publishes a GitHub release for that version, with the notes
# of its section in CHANGELOG.md ("## Kin X.Y.Z, …"). tests/release.test.mjs keeps the versions and
# the changelog in step, so a release cannot go out without notes.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## / { if (found) exit; if (index($0, "## Kin " v ",") == 1) { found = 1; print substr($0, 4) > "title.txt"; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "CHANGELOG.md has no section for Kin $version"; exit 1; fi
          # Links to files in the repository point at this tag on GitHub.
          sed -i -E "s#\]\(([^):#][^):]*)\)#](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/\1)#g" notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$(cat title.txt)" --notes-file notes.md --verify-tag
