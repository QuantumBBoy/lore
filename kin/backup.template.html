<!DOCTYPE html>

  Kin backup panel, shown in the chat by the "backup" action. It works on the same storage as the
  hidden runner. Sharing a file and copying text work in the iPhone app; downloading does not.
  GENERATED by tools/build-kin.mjs from kin/backup.template.html: edit the template and run
  `node tools/build-kin.mjs`.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>Kin backup</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff; --fg: #1d1d1f; --muted: #6e6e73; --line: #d2d2d7; --panel: #f2f2f7;
    --accent: #0a66c2; --accent-fg: #ffffff; --ok: #1a7f37; --bad: #c62828; --warn: #9a6700;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000; --fg: #f5f5f7; --muted: #a1a1a6; --line: #38383a; --panel: #1c1c1e;
      --accent: #4c9aff; --accent-fg: #000000; --ok: #4ade80; --bad: #f87171; --warn: #fbbf24;
    }
  }
  /* The app gives the panel a fixed height (width / aspectRatio, set by the backup action), so
     every state must fit without scrolling: tests/kin.browser.test.mjs checks it. */
  * { box-sizing: border-box; }
  body { margin: 0; padding: 12px 14px; background: var(--bg); color: var(--fg); font: 14px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  h1 { font-size: 16px; margin: 0; }
  p { margin: 0; }
  [hidden] { display: none !important; }
  .muted { color: var(--muted); font-size: 12.5px; }
  .stack > * + * { margin-top: 8px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; padding: 2px; margin: 10px 0; border-radius: 9px; background: var(--panel); }
  .tabs button { min-height: 32px; border: 0; background: transparent; font-weight: 600; }
  .tabs button[aria-selected="true"] { background: var(--bg); box-shadow: 0 0 0 1px var(--line); }
  button, .file {
    position: relative; min-height: 44px; padding: 6px 10px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--panel); color: var(--fg); font: inherit; text-align: center; width: 100%;
  }
  button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  button.danger { color: var(--bad); }
  button.link { min-height: 32px; border: 0; background: transparent; color: var(--accent); }
  /* The real file input covers the button, so a tap opens the picker directly. */
  .file { display: flex; align-items: center; justify-content: center; }
  .file input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; }
  .paste { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
  .paste button { width: auto; }
  textarea { width: 100%; height: 44px; padding: 6px 8px; resize: none; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); font: 12px/1.3 ui-monospace, Menlo, monospace; }
  #status { margin-top: 10px; font-weight: 600; }
  #status.ok { color: var(--ok); }
  #status.bad { color: var(--bad); }
  #status.warn { color: var(--warn); }
</style>
</head>
<body>
<h1 data-t="title"></h1>
<p class="muted" id="stats"></p>

<div class="tabs" role="tablist">
  <button id="tabSave" type="button" role="tab" aria-selected="true" aria-controls="save" data-t="exportTitle"></button>
  <button id="tabRestore" type="button" role="tab" aria-selected="false" aria-controls="restore" data-t="importTitle"></button>
</div>

<section id="save" class="stack" role="tabpanel">
  <p class="muted" data-t="exportHelp"></p>
  <div class="row">
    <button id="share" class="primary" type="button" data-t="share"></button>
    <button id="copy" type="button" data-t="copy"></button>
  </div>
  <button id="mistakes" type="button" hidden></button>
</section>

<section id="restore" class="stack" role="tabpanel" hidden>
  <div id="sources" class="stack">
    <label class="file"><span data-t="pick"></span>
      <input id="pick" type="file" accept=".zip,.json,.txt,application/zip,application/json,text/plain">
    </label>
    <div class="paste">
      <textarea id="paste" data-ph="pastePlaceholder"></textarea>
      <button id="read" type="button" data-t="readText"></button>
    </div>
    <button id="undo" type="button" data-t="undo" hidden></button>
  </div>
  <div id="plan" class="stack" hidden>
    <p id="planText"></p>
    <div class="row">
      <button id="merge" type="button" class="primary" data-t="merge"></button>
      <button id="replace" type="button" class="danger" data-t="replace"></button>
    </div>
    <button id="cancel" type="button" class="link" data-t="cancel"></button>
  </div>
</section>
<p id="status" role="status"></p>

<script>
'use strict';
const Backup = /*BUNDLE*/;

const TEXT = {
  en: {
    title: 'Kin backup',
    stats: (s, last) => `${s.people} ${s.people === 1 ? 'person' : 'people'} · last backup: ${last ?? 'never'} · ${s.changesSinceExport} ${s.changesSinceExport === 1 ? 'change' : 'changes'} since`,
    exportTitle: 'Save',
    exportHelp: 'Keep it in Files or send it to yourself. It has everything, sensitive notes too.',
    share: 'Share file',
    copy: 'Copy as text',
    mistakes: (n) => `Share mistakes for evals (${n})`,
    mistakesShared: 'Shared. Names are replaced by person_1, person_2…; check the file before publishing it.',
    mistakesCopied: 'Copied as text. Names are replaced by person_1, person_2…; check it before publishing it.',
    importTitle: 'Restore',
    pick: 'Choose a backup file',
    pastePlaceholder: 'Or paste a backup here',
    readText: 'Read',
    plan: (p) => `This backup has ${p.people} ${p.people === 1 ? 'person' : 'people'}: ${p.added.length} new ${p.added.length === 1 ? 'file' : 'files'}, ${p.changed.length} changed, ${p.removed.length} only on this phone.`,
    merge: 'Merge',
    replace: 'Replace all',
    cancel: 'Cancel',
    confirm: 'Tap again to confirm',
    undo: 'Undo the last import',
    shared: 'Saved. Keep the file somewhere safe.',
    copied: 'Copied. Paste it in Notes or an email to yourself.',
    cancelled: 'Cancelled.',
    noShare: 'Sharing files is not available here; use "Copy as text".',
    imported: (n) => `Imported: ${n} ${n === 1 ? 'person' : 'people'}. You can undo it.`,
    undone: 'Import undone.',
    notBackup: 'This is not a Kin backup, or it is damaged.',
    failed: (m) => `That did not work: ${m}`,
    empty: 'Paste the text of a backup first.',
  },
  es: {
    title: 'Copia de seguridad de Kin',
    stats: (s, last) => `${s.people} ${s.people === 1 ? 'persona' : 'personas'} · última copia: ${last ?? 'nunca'} · ${s.changesSinceExport} ${s.changesSinceExport === 1 ? 'cambio' : 'cambios'} desde entonces`,
    exportTitle: 'Guardar',
    exportHelp: 'Guárdala en Archivos o mándatela. Lo incluye todo, también las notas sensibles.',
    share: 'Compartir archivo',
    copy: 'Copiar como texto',
    mistakes: (n) => `Compartir errores para evals (${n})`,
    mistakesShared: 'Compartido. Los nombres van como person_1, person_2…; revisa el archivo antes de publicarlo.',
    mistakesCopied: 'Copiado como texto. Los nombres van como person_1, person_2…; revísalo antes de publicarlo.',
    importTitle: 'Recuperar',
    pick: 'Elegir un archivo de copia',
    pastePlaceholder: 'O pega aquí una copia',
    readText: 'Leer',
    plan: (p) => `Esta copia tiene ${p.people} ${p.people === 1 ? 'persona' : 'personas'}: ${p.added.length} ${p.added.length === 1 ? 'archivo nuevo' : 'archivos nuevos'}, ${p.changed.length} ${p.changed.length === 1 ? 'cambiado' : 'cambiados'}, ${p.removed.length} solo en este teléfono.`,
    merge: 'Fusionar',
    replace: 'Reemplazar todo',
    cancel: 'Cancelar',
    confirm: 'Toca otra vez para confirmar',
    undo: 'Deshacer la última importación',
    shared: 'Guardada. Conserva el archivo en un sitio seguro.',
    copied: 'Copiada. Pégala en Notas o en un correo para ti.',
    cancelled: 'Cancelado.',
    noShare: 'Aquí no se pueden compartir archivos; usa "Copiar como texto".',
    imported: (n) => `Importado: ${n} ${n === 1 ? 'persona' : 'personas'}. Puedes deshacerlo.`,
    undone: 'Importación deshecha.',
    notBackup: 'Esto no es una copia de Kin, o está dañada.',
    failed: (m) => `No ha funcionado: ${m}`,
    empty: 'Primero pega el texto de una copia.',
  },
};

const params = new URLSearchParams(location.search);
const lang = (params.get('lang') || 'en').toLowerCase().startsWith('es') ? 'es' : 'en';
const T = TEXT[lang];
const $ = (id) => document.getElementById(id);
const storage = window.localStorage;
const today = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
};
let incoming = null;

document.documentElement.lang = lang;
for (const el of document.querySelectorAll('[data-t]')) el.textContent = T[el.dataset.t];
for (const el of document.querySelectorAll('[data-ph]')) el.placeholder = T[el.dataset.ph];

function status(text, kind = '') {
  $('status').textContent = text;
  $('status').className = kind;
}

function failed(e) {
  status(e && e.code === 'bad-archive' ? T.notBackup : T.failed(e && e.message), 'bad');
}

function showTab(name) {
  for (const [tab, panel] of [['tabSave', 'save'], ['tabRestore', 'restore']]) {
    $(tab).setAttribute('aria-selected', String(panel === name));
    $(panel).hidden = panel !== name;
  }
  status('');
}
$('tabSave').addEventListener('click', () => showTab('save'));
$('tabRestore').addEventListener('click', () => showTab('restore'));

// While a backup waits for Merge or Replace, its summary takes the place of the file and paste controls.
function showPlan(plan) {
  $('plan').hidden = !plan;
  $('sources').hidden = !!plan;
  if (plan) $('planText').textContent = T.plan(plan);
}

function refresh() {
  const s = Backup.stats(storage);
  $('stats').textContent = T.stats(s, s.lastExport);
  $('undo').hidden = !s.hasUndo;
  $('mistakes').hidden = !s.mistakes;
  $('mistakes').textContent = T.mistakes(s.mistakes);
}

$('share').addEventListener('click', async () => {
  const name = Backup.archiveName(today());
  const file = new File([Backup.exportZip(storage)], name, { type: 'application/zip' });
  if (!navigator.share || (navigator.canShare && !navigator.canShare({ files: [file] }))) {
    status(T.noShare, 'warn');
    return;
  }
  try {
    await navigator.share({ files: [file], title: name });
    Backup.markExported(storage, today());
    status(T.shared, 'ok');
    refresh();
  } catch (e) {
    if (e && e.name === 'AbortError') status(T.cancelled);
    else failed(e);
  }
});

$('copy').addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(Backup.exportText(storage, today()));
    Backup.markExported(storage, today());
    status(T.copied, 'ok');
    refresh();
  } catch (e) {
    failed(e);
  }
});

// The mistake log for evals: shared as cases.jsonl, or copied when files cannot be shared.
$('mistakes').addEventListener('click', async () => {
  const { text } = Backup.exportMistakes(storage);
  const file = new File([text], 'cases.jsonl', { type: 'text/plain' });
  try {
    if (navigator.share && (!navigator.canShare || navigator.canShare({ files: [file] }))) {
      await navigator.share({ files: [file], title: 'cases.jsonl' });
      status(T.mistakesShared, 'ok');
    } else {
      await navigator.clipboard.writeText(text);
      status(T.mistakesCopied, 'ok');
    }
  } catch (e) {
    if (e && e.name === 'AbortError') status(T.cancelled);
    else failed(e);
  }
});

async function load(input) {
  try {
    incoming = await Backup.readBackup(input);
    showPlan(Backup.preview(storage, incoming));
    status('');
  } catch (e) {
    incoming = null;
    showPlan(null);
    failed(e);
  }
}

$('pick').addEventListener('change', async (event) => {
  const file = event.target.files && event.target.files[0];
  event.target.value = '';
  if (file) await load(new Uint8Array(await file.arrayBuffer()));
});

$('read').addEventListener('click', () => {
  const text = $('paste').value.trim();
  if (!text) status(T.empty, 'warn');
  else load(text);
});

// Two taps to confirm: the app's webview may not show confirm() dialogs.
function confirmTwice(button, run) {
  let armed = false;
  const label = button.textContent;
  button.addEventListener('click', () => {
    if (!incoming) return;
    if (!armed) {
      armed = true;
      button.textContent = T.confirm;
      setTimeout(() => {
        armed = false;
        button.textContent = label;
      }, 5000);
      return;
    }
    armed = false;
    button.textContent = label;
    run();
  });
}

for (const mode of ['merge', 'replace']) {
  confirmTwice($(mode), () => {
    try {
      const r = Backup.applyBackup(storage, incoming, mode, { today: today() });
      incoming = null;
      showPlan(null);
      $('paste').value = '';
      status(T.imported(r.people), 'ok');
      refresh();
    } catch (e) {
      failed(e);
    }
  });
}

$('cancel').addEventListener('click', () => {
  incoming = null;
  showPlan(null);
  status('');
});

$('undo').addEventListener('click', () => {
  if (Backup.undoImport(storage)) status(T.undone, 'ok');
  refresh();
});

try {
  refresh();
} catch (e) {
  failed(e);
}
</script>
</body>
</html>
