<!DOCTYPE html>
<!--

  Kin calendar panel, shown in the chat by "remind" with "calendar": true. It builds an iCalendar
  file of the dates not exported yet (spec 15.7) and hands it to the share sheet; once shared, it
  records them in the Lore folder so the next export only has what is new or changed.
  GENERATED by tools/build-kin.mjs from kin/calendar.template.html: edit the template and run
  `node tools/build-kin.mjs`.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>Kin calendar</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff; --fg: #1d1d1f; --muted: #6e6e73; --line: #d2d2d7; --panel: #f2f2f7;
    --accent: #0a66c2; --accent-fg: #ffffff; --ok: #1a7f37; --bad: #c62828; --warn: #9a6700;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000; --fg: #f5f5f7; --muted: #a1a1a6; --line: #38383a; --panel: #1c1c1e;
      --accent: #4c9aff; --accent-fg: #000000; --ok: #4ade80; --bad: #f87171; --warn: #fbbf24;
    }
  }
  /* The app gives the panel a fixed height (width / aspectRatio, set by the remind action), so
     every state must fit without scrolling: tests/kin.browser.test.mjs checks it. */
  * { box-sizing: border-box; }
  body { margin: 0; padding: 12px 14px; background: var(--bg); color: var(--fg); font: 14px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  h1 { font-size: 16px; margin: 0; }
  p { margin: 0; }
  [hidden] { display: none !important; }
  .muted { color: var(--muted); font-size: 12.5px; }
  .stack > * + * { margin-top: 8px; }
  button {
    min-height: 44px; padding: 6px 10px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--panel); color: var(--fg); font: inherit; text-align: center; width: 100%;
  }
  button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  button.link { min-height: 32px; border: 0; background: transparent; color: var(--accent); }
  #status { font-weight: 600; }
  #status.ok { color: var(--ok); }
  #status.bad { color: var(--bad); }
  #status.warn { color: var(--warn); }
</style>
</head>
<body class="stack">
<h1 data-t="title"></h1>
<p class="muted" id="stats"></p>
<p id="includes"></p>
<p class="muted" data-t="help"></p>
<button id="share" class="primary" type="button"></button>
<button id="all" class="link" type="button"></button>
<p id="status" role="status"></p>

<script>
'use strict';
const Kin = /*BUNDLE*/;

const plural = (n, one, many) => (n === 1 ? one : many);
const TEXT = {
  en: {
    title: 'Dates for your calendar',
    stats: (pending, done) => `${pending} new or changed · ${done} already exported`,
    includes: (names, more) => `Includes ${names.join(', ')}${more ? ` and ${more} more` : ''}.`,
    help: 'Choose "Save to Files", then open the file in Files to add the dates to your calendar, each with its alert.',
    share: (n) => `Add ${n} to calendar`,
    nothing: 'Everything is already in your calendar.',
    all: (n) => `Export all again (${n})`,
    shared: 'Done. Open the file to add the dates to your calendar.',
    cancelled: 'Cancelled.',
    noShare: 'Sharing files is not available here.',
    empty: 'There are no dates to export yet.',
    failed: (m) => `That did not work: ${m}`,
  },
  es: {
    title: 'Fechas para tu calendario',
    stats: (pending, done) => `${pending} ${plural(pending, 'nueva o cambiada', 'nuevas o cambiadas')} · ${done} ya ${plural(done, 'exportada', 'exportadas')}`,
    includes: (names, more) => `Incluye ${names.join(', ')}${more ? ` y ${more} más` : ''}.`,
    help: 'Elige «Guardar en Archivos» y luego abre el archivo en Archivos para añadir las fechas a tu calendario, cada una con su aviso.',
    share: (n) => `Añadir ${n} al calendario`,
    nothing: 'Todo está ya en tu calendario.',
    all: (n) => `Exportar todo otra vez (${n})`,
    shared: 'Listo. Abre el archivo para añadir las fechas a tu calendario.',
    cancelled: 'Cancelado.',
    noShare: 'Aquí no se pueden compartir archivos.',
    empty: 'Aún no hay fechas que exportar.',
    failed: (m) => `No ha funcionado: ${m}`,
  },
};

const params = new URLSearchParams(location.search);
const lang = (params.get('lang') || 'en').toLowerCase().startsWith('es') ? 'es' : 'en';
const T = TEXT[lang];
const $ = (id) => document.getElementById(id);
const storage = window.localStorage;
const today = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
};

document.documentElement.lang = lang;
for (const el of document.querySelectorAll('[data-t]')) el.textContent = T[el.dataset.t];

function status(text, kind = '') {
  $('status').textContent = text;
  $('status').className = kind;
}

function current() {
  if (!Kin.hasFolder(storage)) return { dates: [] };
  const { folder, snapshot } = Kin.loadFolder(storage);
  return { folder, snapshot, ...Kin.calendarDates(folder, { today: today() }) };
}

function render() {
  const { dates } = current();
  const pending = dates.filter((d) => !d.exported);
  $('stats').textContent = dates.length ? T.stats(pending.length, dates.length - pending.length) : T.empty;
  const names = [...new Set(pending.map((d) => d.name))];
  $('includes').textContent = pending.length ? T.includes(names.slice(0, 3), names.length - 3 > 0 ? names.length - 3 : 0) : T.nothing;
  $('share').textContent = T.share(pending.length);
  $('share').hidden = pending.length === 0;
  $('all').textContent = T.all(dates.length);
  $('all').hidden = dates.length === 0;
}

async function share(which) {
  const state = current();
  const list = which === 'all' ? state.dates : state.dates.filter((d) => !d.exported);
  if (!list.length) return;
  const name = Kin.calendarFileName(today());
  const ics = Kin.buildIcs(state.folder, list, { today: today(), now: new Date(), lang, version: Kin.KIN_VERSION });
  // Some share sheets only accept text files: fall back to text/plain, keeping the .ics name.
  let file = new File([ics], name, { type: 'text/calendar' });
  if (navigator.canShare && !navigator.canShare({ files: [file] })) file = new File([ics], name, { type: 'text/plain' });
  if (!navigator.share || (navigator.canShare && !navigator.canShare({ files: [file] }))) {
    status(T.noShare, 'warn');
    return;
  }
  try {
    await navigator.share({ files: [file], title: name });
    Kin.markExported(state.folder, list);
    Kin.saveFolder(storage, state.folder, state.snapshot);
    status(T.shared, 'ok');
    render();
  } catch (e) {
    if (e && e.name === 'AbortError') status(T.cancelled);
    else status(T.failed(e && e.message), 'bad');
  }
}

$('share').addEventListener('click', () => share('pending'));
$('all').addEventListener('click', () => share('all'));

try {
  render();
} catch (e) {
  status(T.failed(e.message), 'bad');
}
</script>
</body>
</html>
